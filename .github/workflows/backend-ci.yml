name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: when_i_off
          POSTGRES_USER: wio
          POSTGRES_PASSWORD: wio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wio -d when_i_off"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WIO_DB_URL: jdbc:postgresql://localhost:5432/when_i_off
      WIO_DB_USER: wio
      WIO_DB_PASSWORD: wio
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: ./gradlew check --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
