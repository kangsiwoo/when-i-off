name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      # 손으로 고친 스펙도 backend와 대조한다.
      - "desktop/openapi.json"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      # 손으로 고친 스펙도 backend와 대조한다.
      - "desktop/openapi.json"

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: when_i_off
          POSTGRES_USER: wio
          POSTGRES_PASSWORD: wio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wio -d when_i_off"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WIO_DB_URL: jdbc:postgresql://localhost:5432/when_i_off
      WIO_DB_USER: wio
      WIO_DB_PASSWORD: wio
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check
        run: ./gradlew check --no-daemon
      # desktop이 타입을 생성하는 desktop/openapi.json이 지금 backend의 스펙과 같은지 본다 (#56).
      # API를 바꿨으면 로컬에서 ./gradlew exportOpenApi 후 desktop에서 npm run gen:api를 돌려 같이 커밋한다.
      - name: OpenAPI spec is up to date
        run: |
          ./gradlew exportOpenApi --no-daemon
          git diff --exit-code -- ../desktop/openapi.json || {
            echo "::error::desktop/openapi.json is stale. Run './gradlew exportOpenApi' in backend/, then 'npm run gen:api' in desktop/, and commit both."
            exit 1
          }
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test
