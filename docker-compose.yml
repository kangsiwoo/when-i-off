services:
  postgres:
    image: postgres:16
    container_name: when-i-off-postgres
    environment:
      POSTGRES_DB: when_i_off
      POSTGRES_USER: ${WIO_DB_USER:-wio}
      # 볼륨이 비어 있을 때(최초 기동)만 적용된다. 이미 볼륨이 있으면 ALTER USER로 바꾸거나 볼륨을 지운다.
      POSTGRES_PASSWORD: ${WIO_DB_PASSWORD:?.env에 WIO_DB_PASSWORD를 설정해야 한다 (.env.example 참고)}
    # 호스트 밖(같은 네트워크의 다른 기기)에서는 붙지 못하게 루프백에만 연다.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - when_i_off_pgdata:/var/lib/postgresql/data
      # 최초 기동 시에만 실행된다 (테스트 전용 DB 생성).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d when_i_off"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: when-i-off-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # 컨테이너 사이에서는 호스트가 localhost가 아니라 서비스 이름이다.
      WIO_DB_URL: jdbc:postgresql://postgres:5432/when_i_off
      WIO_DB_USER: ${WIO_DB_USER:-wio}
      WIO_DB_PASSWORD: ${WIO_DB_PASSWORD:?.env에 WIO_DB_PASSWORD를 설정해야 한다 (.env.example 참고)}
      # 없으면 compose가 바로 실패한다 — 앱이 뜬 뒤 401로 헤매는 것보다 낫다.
      WIO_API_TOKEN: ${WIO_API_TOKEN:?.env에 WIO_API_TOKEN을 설정해야 한다 (.env.example 참고)}
      # 외부 API 키는 없어도 뜬다. 관리 동기화 API만 503이 된다.
      TAGO_BUS_API: ${TAGO_BUS_API:-}
      REALTIME_TREFFIC_LIGHT_API: ${REALTIME_TREFFIC_LIGHT_API:-}
      WIO_POLLING_ENABLED: ${WIO_POLLING_ENABLED:-false}
      # 오래된 GPS·관측 정리 (#74). 기본 꺼짐. 기간·시각은 backend/README.md의 wio.retention.*
      WIO_RETENTION_ENABLED: ${WIO_RETENTION_ENABLED:-false}
      WIO_RETENTION_DRY_RUN: ${WIO_RETENTION_DRY_RUN:-false}
      WIO_RETENTION_CRON: ${WIO_RETENTION_CRON:-0 30 4 * * *}
    # 토큰 하나로 지키는 API라 기본은 루프백만. 폰에서 붙이려면 리버스 프록시(TLS)를 앞에 둔다.
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # 배치라 `up`으로는 뜨지 않는다. `docker compose run --rm analytics <command>`로 돌린다
  # (analytics/cron.example).
  analytics:
    build:
      context: ./analytics
    profiles: ["batch"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      WIO_DB_URL: jdbc:postgresql://postgres:5432/when_i_off
      WIO_DB_USER: ${WIO_DB_USER:-wio}
      WIO_DB_PASSWORD: ${WIO_DB_PASSWORD:?.env에 WIO_DB_PASSWORD를 설정해야 한다 (.env.example 참고)}

volumes:
  when_i_off_pgdata:
