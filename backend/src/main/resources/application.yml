spring:
  application:
    name: when-i-off-backend
  datasource:
    url: ${WIO_DB_URL:jdbc:postgresql://localhost:5432/when_i_off}
    username: ${WIO_DB_USER:wio}
    password: ${WIO_DB_PASSWORD:wio}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # db/seed는 스키마가 아니라 시드 데이터(R__ 반복 마이그레이션)다. 테스트 프로필에서는
    # 빼서(아래) 테스트가 빈 마스터 테이블을 전제로 돌 수 있게 한다.
    locations: classpath:db/migration,classpath:db/seed
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

wio:
  api-token: ${WIO_API_TOKEN}
  tago:
    service-key: ${TAGO_BUS_API:}
    route-info-base-url: https://apis.data.go.kr/1613000/BusRouteInfoInqireService
    arrival-info-base-url: https://apis.data.go.kr/1613000/ArvlInfoInqireService
    connect-timeout: 5s
    read-timeout: 20s
    max-retries: 2
    retry-backoff: 500ms
  klid:
    signal:
      base-url: https://apis.data.go.kr/B551982/rti
      service-key: ${REALTIME_TREFFIC_LIGHT_API:}
    connect-timeout: 5s
    read-timeout: 20s
    max-retries: 2
    retry-backoff: 500ms
    # K3(NODATA)를 준 stdgCd를 이 시간 동안 폴링에서 건너뛴다 (#31).
    no-data-ttl: 6h
  polling:
    enabled: false
    interval-ms: 60000
    windows: 06:30-09:30,17:30-20:30

---
spring:
  config:
    activate:
      on-profile: local
  jpa:
    show-sql: false
logging:
  level:
    com.kangsiwoo.whenioff: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    clean-disabled: false
    locations: classpath:db/migration
wio:
  api-token: test-token
  polling:
    enabled: false
logging:
  level:
    com.kangsiwoo.whenioff: DEBUG
